services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATA_DIR: /data
      ML_BASE_URL: http://ml:8001
      ML_TIMEOUT: ${ML_TIMEOUT:-120}
      ALLOW_ON_DEMAND_FETCH: "false"
    volumes:
      - ./data/catalog.jsonl:/data/catalog.jsonl:ro
      - ./data/scraped/images:/data/scraped/images:ro
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    environment:
      WINE_INDEX: /artifacts/index.npz
      WINE_DEVICE: ${WINE_DEVICE:-cpu}
      WINE_LOCALIZER: ${WINE_LOCALIZER:-1}
    volumes:
      - ./artifacts/index.npz:/artifacts/index.npz:ro
      - huggingface-cache:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

volumes:
  huggingface-cache:
