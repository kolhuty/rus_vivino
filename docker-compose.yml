services:
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - WINE_DEVICE=${WINE_DEVICE:-cpu}
      - WINE_LOCALIZER=${WINE_LOCALIZER:-1}
    volumes:
      - huggingface-cache:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 240s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATA_DIR=/data
      - ML_BASE_URL=http://ml:8001
      - ML_TIMEOUT=${ML_TIMEOUT:-120}
      - ALLOW_ON_DEMAND_FETCH=false
    volumes:
      - ./data/catalog.jsonl:/data/catalog.jsonl:ro
      - ./data/scraped/images:/data/scraped/images:ro
    depends_on:
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  huggingface-cache: